@media (prefers-color-scheme:dark){:root{--bg:#121315;--cd:#1c1916;--tx:#f5f4f1;--mu:#9a9e98;--g:#706858;--g2:#E6B31F;--bd:#2d2f34;--on:#1c1916;--ac:#706858;--ok:#7cc48c;--bl:#e0d4b8;--or:#B7C4B8;--rd:#ff6b66}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin-inline:auto;padding-bottom:112px;font-size:14px;font-variant-numeric:tabular-nums}
svg{display:block;flex:none}
button,input,select,textarea{font:inherit;color:var(--tx)}
.hd{position:relative;overflow:hidden;background:linear-gradient(145deg,#1c1916,#2f2b26);color:#f5f4f1;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 96px;border-radius:0 0 34px 34px}
.hd::before{content:"";position:absolute;right:-6px;top:-14px;width:150px;height:200px;background:rgba(112,104,88,.14);-webkit-mask:var(--mill) center/contain no-repeat;mask:var(--mill) center/contain no-repeat}.mk{width:39px;height:58px;flex:none;background:linear-gradient(180deg,#9a9078,#706858);-webkit-mask:var(--mill) center/contain no-repeat;mask:var(--mill) center/contain no-repeat}.fl{width:min(240px,70%);aspect-ratio:0.8333;margin:0 auto 10px;background:var(--g);-webkit-mask:var(--full) center/contain no-repeat;mask:var(--full) center/contain no-repeat}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}h1,.sec{font-family:Bitter,Rockwell,"Roboto Slab",Georgia,serif}
.hr{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;gap:10px}
.hd h1{margin:0;font-size:20px;font-weight:800}.hd p{margin:3px 0 0;font-size:12.5px;opacity:.9}
.hb{display:flex;gap:8px;align-items:center}
.avt{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center}
.bd{padding:0 14px;margin-top:-72px;position:relative;z-index:1}
.cd{background:var(--cd);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--bd);box-shadow:0 10px 28px -14px rgba(0,0,0,.35)}
.cd h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cd h3 a{font-size:12px;color:var(--g);font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cd,.cl,.tl4,.hero{animation:up .4s cubic-bezier(.2,.8,.2,1) both}
.hero{background:linear-gradient(160deg,#1c1916,#2f2b26);color:#fff;border-radius:26px;padding:24px 16px 20px;text-align:center;margin-bottom:12px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.pb{width:122px;height:122px;border-radius:50%;margin:0 auto 16px;background:#fff;color:#1c1916;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 10px rgba(255,255,255,.16),0 0 0 22px rgba(255,255,255,.08);transition:transform .15s;cursor:pointer;font-weight:800;font-size:13px}
.pb:active{transform:scale(.93)}.pb.run{color:#d93025;background:#fff4f1;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5),0 0 0 10px rgba(255,255,255,.16)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0),0 0 0 10px rgba(255,255,255,.16)}}
.lv{font-size:36px;font-weight:800;letter-spacing:1.5px}.hs{font-size:13px;opacity:.9;margin-top:2px}
.tl4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
